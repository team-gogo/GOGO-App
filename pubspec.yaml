name: gogo_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_svg: ^2.0.17  # svg 이미지를 사용하기 위란 라이브러리

  go_router: ^14.8.1 # 라우팅을 도와주는 라이브러리

  # =====================
  firebase_core: ^3.12.1 # 구글 로그인 도와주는 라이브러리
  firebase_auth: ^5.5.1
  google_sign_in: ^6.1.0
  # =====================

  # =====================
  bloc: ^9.0.0 # 상태관리 라이브러리
  flutter_bloc: ^9.1.0
  # =====================

  dio: ^5.1.0 # http 연결 라이브러리

  get_it: ^7.6.4 # DI 도와주는 라이브러리

  retrofit: ^4.0.3 # API 연결 도와주는 라이브러리

  json_annotation: ^4.9.0 # Json 코드 제너레이팅 해주는 라이브러리
  web_socket_channel: ^2.1.0 # web socket 프로토콜을 사용하게 해주는 라이브러리

dev_dependencies:
  flutter_test:
    sdk: flutter

  retrofit_generator: ^8.0.6
  build_runner: ^2.4.8
  flutter_lints: ^5.0.0
  json_serializable: ^6.7.1

flutter:
  assets:
    - assets/drawable/
    - assets/typo/

  uses-material-design: true

  fonts:
    - family: suit
      fonts:
        - asset: assets/typo/SUIT-ExtraBold.otf
          weight: 800
        - asset: assets/typo/SUIT-SemiBold.otf
          weight: 600
