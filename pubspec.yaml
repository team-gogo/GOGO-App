name: gogo_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_svg: ^2.0.17  # svg 이미지를 사용하기 위란 라이브러리

  go_router: ^14.8.1 # 라우팅을 도와주는 라이브러리

  google_sign_in: ^6.1.0 # 구글 로그인 도와주는 라이브러리

  # ===================== firebase 라이브러리
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4
  # =====================

  flutter_local_notifications: ^18.0.1 # 알림 라이브러리

  # ===================== 상태관리 라이브러리
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  # =====================

  dio: ^5.1.0 # http 연결 라이브러리

  get_it: ^7.6.4 # DI 도와주는 라이브러리

  retrofit: ^4.0.3 # API 연결 도와주는 라이브러리

  flutter_dotenv: ^5.2.1 # ENV 라이브러리

  rxdart: ^0.28.0 # ReactiveX 라이브러리

  json_annotation: ^4.9.0 # Json 코드 제너레이팅 해주는 라이브러리

  web_socket_channel: ^2.1.0 # web socket 프로토콜을 사용하게 해주는 라이브러리

  flutter_screenutil: ^5.9.3 # 반응형 라이브러리

  intl: ^0.20.2 # 날짜 및 숫자 분석 라이브러리

  flutter_secure_storage: ^9.2.4 # 보안을 위한 aos: keystore, ios: keychain 사용하도록 해주는 라이브러리

  video_player: ^2.9.5 # 동영상 재생 라이브러리

  equatable: ^2.0.7 # 객체 비교를 쉽게 해주는 라이브러리

  bloc_concurrency: ^0.3.0 # bloc의 concurrency를 도와주는 라이브러리

  stream_transform: ^2.1.1 # stream의 concurrency를 도와주는 라이브러리

dev_dependencies:
  flutter_test:
    sdk: flutter

  retrofit_generator: ^8.0.6
  build_runner: ^2.4.8
  flutter_lints: ^5.0.0
  json_serializable: ^6.7.1

flutter:
  assets:
    - assets/drawable/
    - assets/typo/
    - assets/media/
    - .env

  uses-material-design: true

  fonts:
    - family: suit
      fonts:
        - asset: assets/typo/SUIT-ExtraBold.otf
          weight: 800
        - asset: assets/typo/SUIT-SemiBold.otf
          weight: 600
    - family: GmarketSans
      fonts:
        - asset: assets/typo/GmarketSansBold.otf
